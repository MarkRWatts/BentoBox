name: MealTracker
options:
  bundleIdPrefix: com.markwatts
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_PREVIEWS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: "2Y2TMF4L4P"

targets:
  MealTracker:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: MealTracker
    info:
      path: Generated/MealTracker-Info.plist
      properties:
        CFBundleDisplayName: Bento Box
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Bento Box uses your camera to scan barcodes and nutrition labels."
    entitlements:
      path: Generated/MealTracker.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.markwatts.MealTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markwatts.MealTracker
        PRODUCT_NAME: MealTracker
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: MealTrackerWidget
        embed: true
    scheme:
      testTargets:
        - MealTrackerTests
      gatherCoverageData: false

  MealTrackerWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: MealTrackerWidget
      - path: MealTracker/Core/Extensions/Color+Brand.swift
      - path: MealTracker/Core/Shared
    info:
      path: Generated/MealTrackerWidget-Info.plist
      properties:
        CFBundleDisplayName: Bento Box
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/MealTrackerWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.markwatts.MealTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markwatts.MealTracker.MealTrackerWidget
        PRODUCT_NAME: MealTrackerWidget
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"

  MealTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: MealTrackerTests
    dependencies:
      - target: MealTracker
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.markwatts.MealTrackerTests
        GENERATE_INFOPLIST_FILE: YES
